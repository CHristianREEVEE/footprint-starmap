<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足迹星图 V3 · Footprint StarMap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.min.js"></script>
<style>

  :root { --panel:rgba(10,22,38,.92); --pline:rgba(103,232,249,.22); --text:#e2f4ff; --dim:#7c93a8;
    --accent:#22d3ee; --input:rgba(6,16,28,.85); --hover:rgba(34,211,238,.08); --active:rgba(34,211,238,.16);
    --mapbg:#061019; --foot:#22d3ee; --footGlow:rgba(34,211,238,.35); --btnText:#04222c; }
  body { margin:0; background:#061019; }
  .ftip { background:rgba(6,16,28,.85) !important; color:#a5f3fc !important; border:1px solid rgba(103,232,249,.35) !important;
    box-shadow:none !important; font-size:11px !important; padding:2px 7px !important; }
  .leaflet-popup-content-wrapper { background:rgba(10,22,38,.95); color:#e2f4ff; border-radius:13px; }
  .leaflet-popup-tip { background:rgba(10,22,38,.95); }
  .leaflet-bar a, .leaflet-control-layers { background:rgba(10,22,38,.92) !important; color:#a5f3fc !important;
    border-color:rgba(103,232,249,.25) !important; }
  .leaflet-control-attribution { background:rgba(6,16,28,.7) !important; color:#556 !important; }

#wrap { position:fixed; inset:0; }
#map { position:absolute; inset:0; background:var(--mapbg); }
#panel { position:absolute; z-index:1000; top:14px; left:14px; bottom:14px; width:295px;
  background:var(--panel); border:1px solid var(--pline); border-radius:16px; color:var(--text);
  display:flex; flex-direction:column; overflow:hidden; font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
#panel.hidden { display:none; }
#panel header { padding:14px 16px 10px; border-bottom:1px solid var(--pline); }
#panel header h1 { font-size:17px; margin:0 0 2px; color:var(--accent); letter-spacing:.5px; }
#panel header p { margin:0; font-size:11px; color:var(--dim); }
#search { margin:10px 12px 6px; }
#q { width:100%; box-sizing:border-box; padding:9px 12px; border-radius:10px; border:1px solid var(--pline);
  background:var(--input); color:var(--text); font-size:13px; outline:none; }
#q:focus { border-color:var(--accent); }
#crumb { padding:4px 14px; font-size:11.5px; color:var(--dim); min-height:22px; }
#crumb a { color:var(--accent); cursor:pointer; text-decoration:none; }
#crumb a:hover { text-decoration:underline; }
#list { flex:1; overflow-y:auto; padding:4px 8px 10px; }
.sect { font-size:11px; color:var(--dim); padding:8px 8px 4px; letter-spacing:.5px; }
.item { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:9px; cursor:pointer; }
.item:hover { background:var(--hover); }
.item.active { background:var(--active); }
.item .nm { flex:1; font-size:13.5px; }
.item .sub { font-size:10.5px; color:var(--dim); }
.item button { border:none; border-radius:7px; padding:4px 10px; font-size:11px; font-weight:700;
  background:var(--accent); color:var(--btnText); cursor:pointer; }
.item button:hover { filter:brightness(1.15); }
.tipmsg { font-size:11px; color:var(--dim); padding:6px 8px; }
#toggleBtn { position:absolute; z-index:1001; top:14px; left:14px; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--pline); background:var(--panel); color:var(--accent); font-size:17px; cursor:pointer; display:none; }
#legend { position:absolute; z-index:1000; right:14px; bottom:14px; background:var(--panel); border:1px solid var(--pline);
  border-radius:12px; padding:9px 13px; font-size:11px; color:var(--text); line-height:1.7; max-width:270px; }
#legend b { color:var(--accent); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 3px 0 6px; }
.pop { font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif; min-width:230px; }
.pop h3 { margin:0 0 4px; font-size:15px; }
.pop .tag { font-size:10px; background:var(--accent); color:var(--btnText); border-radius:6px; padding:2px 7px; vertical-align:2px; }
.pop .coord { font-size:11px; color:#888; margin-bottom:4px; }
.pop .note { font-size:12px; margin-bottom:7px; }
.pop .phs { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.pop .phs img { width:100%; height:62px; object-fit:cover; border-radius:7px; cursor:zoom-in; background:#ddd; }
.foot-marker { background:none; border:none; }
.foot-marker .fm { width:16px; height:16px; border-radius:50%; background:var(--foot); border:2.5px solid #fff;
  box-shadow:0 0 0 5px var(--footGlow), 0 0 14px var(--footGlow); }
@media (max-width:700px){ #panel{ width:min(320px,82vw); } #legend{ display:none; } }
</style>
</head>

const PY = window.pinyinPro ? window.pinyinPro.pinyin : null;

function pyIndex(name){
  if (!PY) return {full:'', init:''};
  const arr = PY(name, { toneType:'none', type:'array', v:true });
  const full = arr.join('').toLowerCase();
  const init = arr.map(s => (s[0]||'').toLowerCase()).join('');
  return {full, init};
}

/* ---- 高亮管理 ---- */
let hlLayer = null;
function clearHL(){
  if (hlLayer) { map.removeLayer(hlLayer); hlLayer = null; }
  provLayer.eachLayer(l => l.setStyle(DARK ? {fillColor:'#0ea5e9', fillOpacity:.08} : {fillColor:'#2563eb', fillOpacity:.03}));
}
function highlightFeature(f, fly){
  clearHL();
  hlLayer = L.geoJSON(f, {style:{color:'#f59e0b', weight:2.6, opacity:1, fillColor:'#f59e0b', fillOpacity:.14}}).addTo(map);
  if (fly) map.flyToBounds(hlLayer.getBounds(), {maxZoom:11, duration:1.1});
}
function highlightPoint(lat, lng, zoom){
  clearHL();
  hlLayer = L.circleMarker([lat,lng], {radius:14, color:'#f59e0b', weight:2.6, fillOpacity:.12}).addTo(map);
  if (zoom) map.flyTo([lat,lng], zoom, {duration:1.1});
}

/* ---- 数据源: DataV 主 + jsdelivr 镜像兜底 ---- */
async function fetchFull(adcode){
  const url = `https://geo.datav.aliyun.com/areas_v3/bound/${adcode}_full.json`;
  try {
    const r = await fetch(url, {referrerPolicy:'no-referrer'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch(e) {
    const r2 = await fetch('https://cdn.jsdelivr.net/gh/modood/Administrative-divisions-of-China@master/dist/pcas-code.json');
    if (!r2.ok) throw e;
    const tree = await r2.json();
    const find = (nodes, code) => (nodes||[]).reduce((acc,n) => acc || (n.code === String(code).slice(0, n.code.length>2?6:2) && n) || find(n.children, code), null);
    const node = find(tree, adcode);
    if (!node || !node.children) throw e;
    return { fallback:true, children: node.children.map(ch => ({properties:{name:ch.name, adcode:ch.code}})) };
  }
}
/* 单要素边界 (用于联想结果高亮): {adcode}.json */
const geomCache = {};
async function fetchOne(adcode){
  if (geomCache[adcode]) return geomCache[adcode];
  const r = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${adcode}.json`, {referrerPolicy:'no-referrer'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  geomCache[adcode] = d.features[0];
  return d.features[0];
}

/* ---- 全国三级行政树 (联想索引, 懒加载) ---- */
let treePromise = null, cityIndex = [];
function ensureTree(){
  if (treePromise) return treePromise;
  treePromise = fetch('https://cdn.jsdelivr.net/gh/modood/Administrative-divisions-of-China@master/dist/pca-code.json')
    .then(r => r.json()).then(tree => {
      cityIndex = [];
      const py = PY || (s => ({arr:[s]}));
      for (const prov of tree) for (const city of (prov.children||[])) {
        cityIndex.push({code:city.code, name:city.name, level:'city', parent:prov.name, provCode:prov.code});
        for (const co of (city.children||[]))
          cityIndex.push({code:co.code, name:co.name, level:'county', parent:city.name, provName:prov.name, provCode:prov.code});
      }
      cityIndex.forEach(o => { const i = pyIndex(o.name); o.full = i.full; o.init = i.init; });
      return cityIndex;
    });
  return treePromise;
}

/* ---- 级联导航 ---- */
const listEl = document.getElementById('list'), crumbEl = document.getElementById('crumb'), qEl = document.getElementById('q');
let crumbChain = [];
function itemHTML(name, sub){ return `<div class="nm">${name}<div class="sub">${sub||''}</div></div>`; }
function mkItem(name, sub, onPick, onGo){
  const it = document.createElement('div'); it.className='item';
  it.innerHTML = itemHTML(name, sub);
  it.onclick = onPick;
  const go = document.createElement('button'); go.textContent='GO';
  go.onclick = e => { e.stopPropagation(); onGo(); };
  it.appendChild(go);
  return it;
}
function renderCrumb(){
  crumbEl.innerHTML = `<a data-lvl="root" onclick="resetToRoot()">全国</a>` +
    crumbChain.map(c => ` › <span>${c.name}</span>`).join('');
}
window.resetToRoot = () => { crumbChain=[]; renderCrumb(); clearHL(); renderProvinces(qEl.value); };

function provFeature(code){ return PROVS.features.find(x => x.properties.c === code); }
function provCenter(code){ const f = provFeature(code); return f ? f.properties.ct : [112,34]; }

/* 省级行: 点行=高亮+展开地级市; GO=高亮+飞过去 */
function renderProvinces(kw){
  const k = (kw||'').trim().toLowerCase();
  listEl.innerHTML = '';
  const s = document.createElement('div'); s.className='sect'; s.textContent = k ? '省级行政区' : '省级行政区 · 点行高亮 · GO 跳转';
  listEl.appendChild(s);
  PROVS.features.map(f => ({p:f.properties, idx:pyIndex(f.properties.n)}))
    .filter(o => !k || o.p.n.toLowerCase().includes(k) || o.idx.full.includes(k) || o.idx.init.includes(k))
    .map(o => ({o, rank: !k ? 0 : o.idx.init.startsWith(k) ? 0 : o.p.n.toLowerCase().startsWith(k) ? 1 : o.idx.full.startsWith(k) ? 2 : 3}))
    .filter(x => !(k.length <= 2 && x.rank === 3))   // 短词弱匹配省份刷屏, 过滤
    .sort((a,b) => a.rank - b.rank)
    .forEach(({o}) => {
      const it = mkItem(o.p.n, `${o.p.c} · ${o.p.ct[1].toFixed(1)}N ${o.p.ct[0].toFixed(1)}E`,
        () => pickProvince(o.p.c, o.p.n),
        () => pickProvince(o.p.c, o.p.n, true));
      listEl.appendChild(it);
    });
  if (!listEl.querySelector('.item')) listEl.innerHTML += '<div class="tipmsg">省级无匹配</div>';
}
window.pickProvince = async (code, name, fly) => {
  crumbChain = [{code, name}]; renderCrumb();
  const f = provFeature(code);
  if (f) highlightFeature(f, !!fly);
  await openCities(code, name, fly);
};
async function openCities(code, name){
  listEl.innerHTML = '<div class="tipmsg">加载中…</div>';
  try {
    const data = await fetchFull(code);
    crumbChain = [{code, name}]; renderCrumb();
    listEl.innerHTML = '';
    const s = document.createElement('div'); s.className='sect';
    s.textContent = `${name} · ${data.children.length} 个地级市/州（点行=高亮+看县区 · GO=飞过去）`;
    listEl.appendChild(s);
    if (data.fallback) listEl.innerHTML += '<div class="tipmsg">⚠ 边界服务不可达（已降级：高亮不可用，GO 跳省中心附近）</div>';
    data.children.forEach(ch => {
      const p = ch.properties;
      const it = mkItem(p.name, String(p.adcode||''),
        async () => {  // 点名: 高亮 + 展开县区
          if (!data.fallback) { try { highlightFeature(await fetchOne(p.adcode), false); } catch(e){} }
          [...listEl.querySelectorAll('.item')].forEach(x=>x.classList.remove('active'));
          it.classList.add('active');
          await openCounties(p.adcode, p.name, code, name);
        },
        async () => {  // GO: 高亮 + 飞过去
          if (!data.fallback) { try { highlightFeature(await fetchOne(p.adcode), true); } catch(e){ highlightPoint(...provCenter(code), 8); } }
          else highlightPoint(...provCenter(code), 8);
        });
      listEl.appendChild(it);
    });
  } catch(e) {
    listEl.innerHTML = `<div class="tipmsg">加载失败（${e.message}）—— 已尝试镜像兜底，请检查网络</div>`;
  }
}
async function openCounties(code, name, pcode, pname){
  listEl.innerHTML = '<div class="tipmsg">加载中…</div>';
  try {
    const data = await fetchFull(code);
    crumbChain = [{code:pcode, name:pname},{code, name}]; renderCrumb();
    listEl.innerHTML = '';
    const s = document.createElement('div'); s.className='sect';
    s.textContent = `${name} · ${data.children.length} 个县区（点行=高亮 · GO=飞过去）`;
    listEl.appendChild(s);
    data.children.forEach(ch => {
      const p = ch.properties;
      const it = mkItem(p.name, String(p.adcode||''),
        async () => { if (!data.fallback) { try { highlightFeature(await fetchOne(p.adcode), false); } catch(e){} }
                      [...listEl.querySelectorAll('.item')].forEach(x=>x.classList.remove('active')); it.classList.add('active'); },
        async () => { if (!data.fallback) { try { highlightFeature(await fetchOne(p.adcode), true); } catch(e){ highlightPoint(...provCenter(pcode), 10); } }
                      else highlightPoint(...provCenter(pcode), 10); });
      listEl.appendChild(it);
    });
  } catch(e) {
    listEl.innerHTML = `<div class="tipmsg">县区加载失败（${e.message}）</div>`;
  }
}

/* ---- 联想搜索: 省 + 地级市 + 县区 ---- */
async function renderSearch(kw){
  const k = (kw||'').trim().toLowerCase();
  renderProvinces(k);
  if (!k) return;
  const sec = document.createElement('div'); sec.className='sect'; sec.textContent = '市 / 县区联想';
  listEl.appendChild(sec);
  if (!PY) { listEl.innerHTML += '<div class="tipmsg">拼音组件未加载，仅支持汉字搜索</div>'; return; }
  try { await ensureTree(); } catch(e) { listEl.innerHTML += `<div class="tipmsg">全国区划索引加载失败</div>`; return; }
  const hits = cityIndex
    .filter(o => o.name.toLowerCase().includes(k) || o.full.includes(k) || o.init.includes(k))
    .map(o => ({o, rank: o.init.startsWith(k) ? 0 : o.name.toLowerCase().startsWith(k) ? 1 : o.full.startsWith(k) ? 2 : 3}))
    .sort((a,b) => (a.rank*10 + (a.o.level==='city'?0:1)) - (b.rank*10 + (b.o.level==='city'?0:1)))
    .slice(0, 60)
    .map(x => x.o);
  if (!hits.length) { listEl.innerHTML += '<div class="tipmsg">市/县区无匹配</div>'; return; }
  hits.forEach(o => {
    const it = mkItem(o.name, `${o.level==='city'?'地级市':'县区'} · ${o.parent}`,
      async () => {  // 点名: 高亮 (+展开下级: 市→县区)
        try { highlightFeature(await fetchOne(o.code), false); } catch(e){ highlightPoint(...provCenter(o.provCode), o.level==='city'?8:10); }
        [...listEl.querySelectorAll('.item')].forEach(x=>x.classList.remove('active')); it.classList.add('active');
        if (o.level==='city') await openCounties(o.code, o.name, o.provCode, o.parent);
      },
      async () => {  // GO: 高亮 + 飞过去
        try { highlightFeature(await fetchOne(o.code), true); } catch(e){ highlightPoint(...provCenter(o.provCode), o.level==='city'?8:10); }
      });
    listEl.appendChild(it);
  });
}
qEl.addEventListener('input', () => { crumbChain=[]; renderCrumb(); clearHL(); renderSearch(qEl.value); });
renderSearch('');
document.getElementById('toggleBtn').onclick = () => document.getElementById('panel').classList.toggle('hidden');
if (window.innerWidth < 700) { document.getElementById('panel').classList.add('hidden'); document.getElementById('toggleBtn').style.display='block'; }
</script>
