<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {

    color:#e2e8f0;
  }
  #stage { position:fixed; inset:0; }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg.dragging { cursor:grabbing; }
  .stars circle { fill:#cfe8ff; }
  .grid line { stroke:#1d3a55; stroke-width:.5; opacity:.35; }
  .china path { fill:rgba(56,189,248,.055); stroke:#4cc3f7; stroke-width:1.1;
    stroke-linejoin:round; filter:drop-shadow(0 0 6px rgba(56,189,248,.25)); }
  .route { fill:none; stroke:#67e8f9; stroke-width:1.4; stroke-dasharray:7 6;
    opacity:.75; filter:drop-shadow(0 0 4px rgba(103,232,249,.5)); }
  .route .dash { animation: flow 3s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-26; } }
  .city .hit { fill:transparent; }
  .city .halo { fill:rgba(34,211,238,.14); stroke:rgba(103,232,249,.55); stroke-width:1;
    animation: pulse 2.6s ease-out infinite; }
  .city .core { fill:#22d3ee; filter:drop-shadow(0 0 7px rgba(34,211,238,.95)); }
  @keyframes pulse { 0%{transform:scale(.55);opacity:.9} 70%{transform:scale(1.5);opacity:0} 100%{opacity:0} }
  .clabel { fill:#dbeafe; font-size:15px; font-weight:600; paint-order:stroke;
    stroke:#04101d; stroke-width:3px; cursor:pointer; }
  .clabel:hover, .clabel.on { fill:#67e8f9; }
  .city.on .halo { stroke:#fbbf24; }
  .city.on .core { fill:#fbbf24; filter:drop-shadow(0 0 9px rgba(251,191,36,.95)); }
  header { position:fixed; top:22px; left:28px; z-index:5; pointer-events:none; }
  header h1 { font-size:22px; letter-spacing:2px; font-weight:700;
    background:linear-gradient(90deg,#7dd3fc,#67e8f9,#a5f3fc);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { font-size:12px; color:#64748b; margin-top:5px; letter-spacing:1px; }
  .panel { position:fixed; right:26px; top:76px; width:264px; z-index:5;
    background:rgba(11,23,40,.72); border:1px solid rgba(103,232,249,.22);
    border-radius:14px; padding:18px 20px; backdrop-filter:blur(12px);
    box-shadow:0 8px 32px rgba(0,0,0,.45); opacity:0; transform:translateX(14px);
    transition:all .28s ease; pointer-events:none; }
  .panel.show { opacity:1; transform:none; pointer-events:auto; }
  .panel h2 { font-size:20px; color:#f8fafc; }
  .panel .en { font-size:11px; color:#67e8f9; letter-spacing:2px; text-transform:uppercase; }
  .panel .prov { display:inline-block; margin-top:9px; font-size:12px; color:#7dd3fc;
    border:1px solid rgba(125,211,252,.35); border-radius:99px; padding:2px 10px; }
  .panel .note { margin-top:11px; font-size:13px; line-height:1.7; color:#94a3b8; }
  .panel .coord { margin-top:11px; font-size:11px; color:#475569; font-family:monospace; }
  .legend { position:fixed; left:28px; bottom:22px; z-index:5; font-size:12px;
    color:#64748b; background:rgba(11,23,40,.6); border:1px solid rgba(103,232,249,.14);
    border-radius:10px; padding:10px 14px; backdrop-filter:blur(8px); line-height:1.8; }
  .legend b { color:#7dd3fc; font-weight:600; }
  .tip { position:fixed; z-index:9; pointer-events:none; background:rgba(8,18,32,.92);
    border:1px solid rgba(103,232,249,.3); border-radius:8px; padding:5px 10px;
    font-size:12px; color:#cffafe; opacity:0; transition:opacity .15s; }
</style>

const CITIES = [{"id":"shanghai","name":"上海","en":"Shanghai","lng":121.4737,"lat":31.2304,"prov":"直辖市","note":"长江入海口，华东枢纽","x":833.6,"y":490.1},{"id":"yingshang","name":"颍上","en":"Yingshang","lng":116.2619,"lat":32.6386,"prov":"安徽省 · 阜阳市","note":"管仲故里，八里河湿地","x":373.8,"y":343.7},{"id":"maanshan","name":"马鞍山","en":"Ma'anshan","lng":118.5076,"lat":31.6704,"prov":"安徽省","note":"钢城，采石矶临长江","x":571.9,"y":444.6},{"id":"nanjing","name":"南京","en":"Nanjing","lng":118.7969,"lat":32.0603,"prov":"江苏省","note":"六朝古都，秦淮河畔","x":597.4,"y":404.1},{"id":"wuhan","name":"武汉","en":"Wuhan","lng":114.3055,"lat":30.5928,"prov":"湖北省","note":"九省通衢，两江交汇","x":201.2,"y":555.6},{"id":"xuzhou","name":"徐州","en":"Xuzhou","lng":117.2846,"lat":34.2044,"prov":"江苏省","note":"五省通衢，楚汉故地","x":464.0,"y":178.1},{"id":"hangzhou","name":"杭州","en":"Hangzhou","lng":120.1551,"lat":30.2741,"prov":"浙江省","note":"西湖与钱塘，人间天堂","x":717.3,"y":588.2}];
const svg = document.getElementById('map');
const world = document.getElementById('world');
let view = {x:0, y:0, k:1};
function applyView(){
  world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}
function svgPoint(e){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = svgPoint(e);
  const k = Math.min(8, Math.max(0.6, view.k * (e.deltaY < 0 ? 1.18 : 1/1.18)));
  view.x = p.x - (p.x - view.x) * k / view.k;
  view.y = p.y - (p.y - view.y) * k / view.k;
  view.k = k; applyView();
}, {passive:false});
let drag = null;
svg.addEventListener('pointerdown', e => { drag = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y}; svg.classList.add('dragging'); });
window.addEventListener('pointermove', e => {
  if(!drag) return;
  view.x = drag.vx + (e.clientX - drag.sx);
  view.y = drag.vy + (e.clientY - drag.sy);
  applyView();
});
window.addEventListener('pointerup', () => { drag = null; svg.classList.remove('dragging'); });

const panel = document.getElementById('panel');
const tip = document.getElementById('tip');
function select(id){

  panel.querySelector('.en').textContent = c.en;
  panel.querySelector('.prov').textContent = c.prov;
  panel.querySelector('.note').textContent = c.note;
  panel.querySelector('.coord').textContent = `${c.lat.toFixed(4)}°N, ${c.lng.toFixed(4)}°E`;
  panel.classList.add('show');
}
document.querySelectorAll('.city,.clabel').forEach(el => {
  el.addEventListener('click', () => select(el.dataset.id));
  el.addEventListener('pointerenter', e => {
    const c = CITIES.find(c => c.id === el.dataset.id);
    tip.textContent = c.name + ' · ' + c.prov;
    tip.style.opacity = 1;
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 10) + 'px';
  });
  el.addEventListener('pointermove', e => {
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 10) + 'px';
  });
  el.addEventListener('pointerleave', () => tip.style.opacity = 0);
});
applyView();
</script>
</body>
</html>
